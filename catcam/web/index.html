<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d0c"><title>CatCam</title>
<style>
:root{color-scheme:dark;--bg:#090b0a;--panel:#121614;--panel2:#181d1a;--text:#f3f5f3;--muted:#929a95;--accent:#a8d5b5;--line:#262d29}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#1b2920 0,#090b0a 45%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
main{width:min(1120px,100%);margin:auto;padding:18px 16px 40px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.brand{display:flex;gap:10px;align-items:center}.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px #a8d5b577}h1{font-size:21px;margin:0}.status{font-size:12px;color:var(--muted)}
.card{background:linear-gradient(180deg,#171c19,#111512);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 18px 50px #0008}.video{aspect-ratio:16/10;background:#000;position:relative}.video img{width:100%;height:100%;object-fit:cover;display:block}.live{position:absolute;top:14px;left:14px;padding:7px 10px;border-radius:999px;background:#080a09cc;backdrop-filter:blur(12px);font-size:11px;letter-spacing:.5px}
.controls{display:flex;gap:9px;padding:13px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:14px;padding:11px 14px;font-weight:600}.btn.primary{background:var(--accent);color:#0b100d;border-color:transparent}
.grid{display:grid;grid-template-columns:1.4fr .8fr;gap:14px;margin-top:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px}.panel h2{font-size:15px;margin:0 0 13px}.muted{color:var(--muted);font-size:13px}.timeline{height:64px;border-radius:14px;background:#0d100e;border:1px solid var(--line);position:relative;overflow:hidden}.timeline:after{content:"";position:absolute;left:35%;top:0;bottom:0;width:2px;background:var(--accent);box-shadow:0 0 12px #a8d5b5}.event{position:absolute;top:22px;width:7px;height:20px;border-radius:5px;background:#77857b}.event:nth-child(1){left:12%}.event:nth-child(2){left:28%}.event:nth-child(3){left:51%}.event:nth-child(4){left:76%}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#0d100e;border:1px solid var(--line);border-radius:14px;padding:12px}.stat b{display:block;font-size:17px}.stat span{font-size:11px;color:var(--muted)}
@media(max-width:760px){main{padding:12px}.grid{grid-template-columns:1fr}.video{aspect-ratio:4/3}.controls{overflow:auto}.btn{white-space:nowrap}}
</style></head><body><main>
<header><div class="brand"><span class="dot"></span><h1>CatCam</h1></div><div class="status">● Camera online</div></header>
<section class="card"><div class="video"><img id="camera" alt="Live camera"><span class="live">LIVE</span></div>
<div class="controls"><button class="btn primary" onclick="snapshot()">Snapshot</button><button class="btn" onclick="alert('Audio will be connected in V2.')">Listen</button><button class="btn" onclick="alert('Recording control will be connected to the Android recorder.')">Record</button></div></section>
<section class="grid"><div class="panel"><h2>Activity</h2><div class="timeline"><i class="event"></i><i class="event"></i><i class="event"></i><i class="event"></i></div><p class="muted">Local playback and event markers will appear here after rolling recording is enabled.</p></div>
<div class="panel"><h2>Camera</h2><div class="stats"><div class="stat"><b>Online</b><span>Connection</span></div><div class="stat"><b>Local</b><span>Storage</span></div><div class="stat"><b>Ready</b><span>Device</span></div></div></div></section>
</main><script>
const params=new URLSearchParams(location.search),base=params.get('camera')||location.origin;
document.querySelector('#camera').src=base.replace(/\/$/,'')+'/live.mjpeg';
function snapshot(){window.open(base.replace(/\/$/,'')+'/snapshot.jpg','_blank')}
</script></body></html>
