<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d0c"><title>CatCam</title>
<style>
:root{color-scheme:dark;--panel:#121614;--panel2:#181d1a;--text:#f3f5f3;--muted:#929a95;--accent:#a8d5b5;--line:#262d29}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#1b2920 0,#090b0a 45%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
main{width:min(1120px,100%);margin:auto;padding:18px 16px 40px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.brand{display:flex;gap:10px;align-items:center}.dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}h1{font-size:21px;margin:0}.status{font-size:12px;color:var(--muted)}
.card,.panel{background:linear-gradient(180deg,#171c19,#111512);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 18px 50px #0008}.video{aspect-ratio:16/10;background:#000;position:relative}.video img{width:100%;height:100%;object-fit:cover;display:block}.live{position:absolute;top:14px;left:14px;padding:7px 10px;border-radius:999px;background:#080a09cc;font-size:11px}.controls{display:flex;gap:9px;padding:13px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:14px;padding:11px 14px;font-weight:600}.btn.primary{background:var(--accent);color:#0b100d;border-color:transparent}
.grid{display:grid;grid-template-columns:1.4fr .8fr;gap:14px;margin-top:14px}.panel{padding:16px}.panel h2{font-size:15px;margin:0 0 13px}.muted{color:var(--muted);font-size:13px}.recordings{display:grid;gap:8px}.clip{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#0d100e;border:1px solid var(--line);border-radius:14px;padding:10px}.clip button{border:0;background:transparent;color:var(--accent);font-weight:700}video#player{width:100%;border-radius:14px;background:#000;margin-top:12px;display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#0d100e;border:1px solid var(--line);border-radius:14px;padding:12px}.stat b{display:block;font-size:17px}.stat span{font-size:11px;color:var(--muted)}
@media(max-width:760px){main{padding:12px}.grid{grid-template-columns:1fr}.video{aspect-ratio:4/3}.controls{overflow:auto}.btn{white-space:nowrap}}
</style></head><body><main>
<header><div class="brand"><span class="dot"></span><h1>CatCam</h1></div><div id="status" class="status">Connecting…</div></header>
<section class="card"><div class="video"><img id="camera" alt="Live camera"><span class="live">LIVE</span></div><div class="controls"><button class="btn primary" onclick="snapshot()">Snapshot</button><button class="btn" onclick="refresh()">Refresh</button></div></section>
<section class="grid"><div class="panel"><h2>Recordings · rolling 48h</h2><div id="recordings" class="recordings"><p class="muted">Loading local recordings…</p></div><video id="player" controls playsinline></video></div>
<div class="panel"><h2>Camera</h2><div class="stats"><div class="stat"><b id="online">—</b><span>Connection</span></div><div class="stat"><b id="count">—</b><span>Clips</span></div><div class="stat"><b id="storage">—</b><span>Storage</span></div></div><p class="muted">Nothing is uploaded. Recordings stay on the Android camera.</p></div></section></main>
<script>
const base=location.origin;document.querySelector("#camera").src=base+"/live.mjpeg";
function snapshot(){window.open(base+"/snapshot.jpg","_blank")}
function fmtBytes(n){if(n<1048576)return Math.round(n/1024)+" KB";if(n<1073741824)return(n/1048576).toFixed(1)+" MB";return(n/1073741824).toFixed(1)+" GB"}
function fmtTime(ms){return new Date(ms).toLocaleString([],{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"})}
async function refresh(){try{const s=await fetch(base+"/api/status"),r=await fetch(base+"/api/recordings");const st=await s.json(),recs=await r.json();document.querySelector("#status").textContent="● Camera online";document.querySelector("#online").textContent="Online";document.querySelector("#count").textContent=recs.length;document.querySelector("#storage").textContent=fmtBytes(st.storageBytes);const box=document.querySelector("#recordings");box.innerHTML="";if(!recs.length){box.innerHTML="<p class='muted'>No completed clips yet.</p>";return}recs.forEach(x=>{const row=document.createElement("div");row.className="clip";row.innerHTML="<span>"+fmtTime(x.modified)+"<br><small class='muted'>"+fmtBytes(x.size)+"</small></span><button>PLAY</button>";row.querySelector("button").onclick=()=>{const p=document.querySelector("#player");p.src=base+x.url;p.style.display="block";p.play().catch(()=>{})};box.appendChild(row)})}catch(e){document.querySelector("#status").textContent="● Camera unavailable"}}
refresh();setInterval(refresh,15000);
</script></body></html>
